<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager — Pair Version (Cursor)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* === Pair Version Styles — written deliberately line by line === */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .app {
      width: 100%;
      max-width: 560px;
    }

    /* Header */
    header {
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1a1a1a;
    }
    header p {
      color: #666;
      margin-top: 4px;
      font-size: 0.9rem;
    }

    /* Add task form */
    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .add-form input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      background: white;
      outline: none;
      transition: border-color 0.15s;
    }
    .add-form input:focus { border-color: #4f46e5; }
    .add-form input::placeholder { color: #aaa; }
    .add-form button {
      padding: 10px 18px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .add-form button:hover { background: #4338ca; }

    /* Filter buttons */
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .filters button {
      padding: 6px 14px;
      border: 1.5px solid #ddd;
      border-radius: 6px;
      background: white;
      color: #555;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filters button.active {
      background: #4f46e5;
      border-color: #4f46e5;
      color: white;
    }

    /* Task count */
    .task-count {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 12px;
    }

    /* Task list */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Individual task */
    .task {
      background: white;
      border: 1.5px solid #e8e8e8;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.15s;
    }
    .task:hover { border-color: #c7c7c7; }
    .task.completed { background: #fafafa; }

    /* Checkbox */
    .task input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #4f46e5;
      flex-shrink: 0;
    }

    /* Task title */
    .task span {
      flex: 1;
      font-size: 0.95rem;
      color: #1a1a1a;
    }
    .task.completed span {
      text-decoration: line-through;
      color: #aaa;
    }

    /* Delete button */
    .task .delete {
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0 4px;
      transition: color 0.15s;
      line-height: 1;
    }
    .task .delete:hover { color: #e53e3e; }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 48px 0;
      color: #aaa;
      font-size: 0.9rem;
    }

    /* Footer */
    footer {
      margin-top: 40px;
      color: #bbb;
      font-size: 0.75rem;
      text-align: center;
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

  // ============================================================
  // PAIR PROGRAMMING VERSION — Built with Cursor + AI inline
  // Each function written deliberately; AI suggestions accepted
  // selectively. Every line reviewed and understood.
  // Build time: ~47 minutes | Files: 1 | Components: 2
  // ============================================================

  // FilterBar — renders All / Active / Completed buttons
  // Cursor suggested the map, I kept it; I wrote the className logic
  const FilterBar = ({ current, onChange }) => {
    const filters = ['all', 'active', 'completed'];
    return (
      <div className="filters">
        {filters.map(f => (
          <button
            key={f}
            className={current === f ? 'active' : ''}
            onClick={() => onChange(f)}
          >
            {f.charAt(0).toUpperCase() + f.slice(1)}
          </button>
        ))}
      </div>
    );
  };

  // App — main component
  // State is simple and flat: tasks array + filter string
  const App = () => {
    const [tasks, setTasks] = React.useState([
      { id: 1, title: 'Review pull requests', completed: false },
      { id: 2, title: 'Update project README', completed: true },
      { id: 3, title: 'Ship the feature branch', completed: false },
    ]);
    const [input, setInput] = React.useState('');
    const [filter, setFilter] = React.useState('all');

    // Filter logic lives here — line 52, App.jsx equivalent
    // Easy to find: filter is in one place, not spread across files
    const filteredTasks = tasks.filter(task => {
      if (filter === 'active') return !task.completed;
      if (filter === 'completed') return task.completed;
      return true; // 'all'
    });

    const addTask = () => {
      const title = input.trim();
      if (!title) return;
      setTasks(prev => [...prev, { id: Date.now(), title, completed: false }]);
      setInput('');
    };

    const toggleTask = (id) => {
      setTasks(prev =>
        prev.map(t => t.id === id ? { ...t, completed: !t.completed } : t)
      );
    };

    const deleteTask = (id) => {
      setTasks(prev => prev.filter(t => t.id !== id));
    };

    const handleKey = (e) => {
      if (e.key === 'Enter') addTask();
    };

    return (
      <div className="app">
        <header>
          <h1>Task Manager</h1>
          <p>Built with Cursor — AI pair programming</p>
        </header>

        {/* Add task */}
        <div className="add-form">
          <input
            type="text"
            placeholder="Add a task and press Enter..."
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={handleKey}
          />
          <button onClick={addTask}>Add</button>
        </div>

        {/* Filter */}
        <FilterBar current={filter} onChange={setFilter} />

        {/* Count */}
        <p className="task-count">
          {filteredTasks.length} task{filteredTasks.length !== 1 ? 's' : ''}
        </p>

        {/* Tasks */}
        <div className="task-list">
          {filteredTasks.length === 0
            ? <div className="empty">No tasks here yet.</div>
            : filteredTasks.map(task => (
              <div key={task.id} className={`task ${task.completed ? 'completed' : ''}`}>
                <input
                  type="checkbox"
                  checked={task.completed}
                  onChange={() => toggleTask(task.id)}
                />
                <span>{task.title}</span>
                <button className="delete" onClick={() => deleteTask(task.id)}>×</button>
              </div>
            ))
          }
        </div>

        <footer>Built with Cursor · Pair Version · {new Date().getFullYear()}</footer>
      </div>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
