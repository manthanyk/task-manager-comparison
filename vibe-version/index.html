<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Vibe Version (Lovable)</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* ===== GENERATED BY LOVABLE — DO NOT EDIT MANUALLY ===== */
    :root {
      --bg-primary: #0f0f13;
      --bg-secondary: #1a1a24;
      --bg-card: #22222f;
      --bg-hover: #2a2a3a;
      --accent-primary: #7c5cfc;
      --accent-secondary: #5c8afc;
      --accent-gradient: linear-gradient(135deg, #7c5cfc, #5c8afc);
      --text-primary: #f0f0ff;
      --text-secondary: #9898b8;
      --text-muted: #5a5a7a;
      --border: #2a2a3f;
      --success: #43d692;
      --danger: #f24f4f;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }
    /* AppShell */
    .app-shell {
      width: 100%;
      max-width: 680px;
    }
    /* AppHeader */
    .app-header {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeInDown 0.6s ease;
    }
    .app-header .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(124,92,252,0.15);
      border: 1px solid rgba(124,92,252,0.3);
      color: var(--accent-primary);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .app-header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .app-header p {
      color: var(--text-secondary);
      margin-top: 8px;
      font-size: 0.95rem;
    }
    /* StatsBar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
      animation: fadeIn 0.5s ease 0.1s both;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      transition: transform 0.2s, border-color 0.2s;
    }
    .stat-card:hover { transform: translateY(-2px); border-color: var(--accent-primary); }
    .stat-card .stat-value {
      font-size: 1.8rem;
      font-weight: 800;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-card .stat-label {
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 4px;
    }
    /* InputPanel */
    .input-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      animation: fadeIn 0.5s ease 0.2s both;
    }
    .input-wrapper {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .task-input {
      flex: 1;
      background: var(--bg-secondary);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .task-input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(124,92,252,0.15);
    }
    .task-input::placeholder { color: var(--text-muted); }
    .add-btn {
      background: var(--accent-gradient);
      border: none;
      border-radius: 12px;
      padding: 12px 22px;
      color: white;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      white-space: nowrap;
    }
    .add-btn:hover { opacity: 0.9; transform: scale(1.02); }
    .add-btn:active { transform: scale(0.97); }
    /* FilterTabBar */
    .filter-tab-bar {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 20px;
      gap: 4px;
      animation: fadeIn 0.5s ease 0.3s both;
    }
    .filter-tab {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-tab.active {
      background: var(--accent-gradient);
      color: white;
      box-shadow: 0 2px 12px rgba(124,92,252,0.35);
    }
    /* TaskListContainer */
    .task-list-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: fadeIn 0.5s ease 0.4s both;
    }
    /* TaskItemCard */
    .task-item-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.25s;
      cursor: pointer;
      animation: slideIn 0.3s ease;
    }
    .task-item-card:hover { background: var(--bg-hover); border-color: rgba(124,92,252,0.3); transform: translateX(4px); }
    .task-item-card.completed { opacity: 0.55; }
    .checkbox-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      background: transparent;
    }
    .task-item-card.completed .checkbox-circle {
      background: var(--success);
      border-color: var(--success);
    }
    .checkbox-checkmark { color: white; font-size: 13px; font-weight: 700; }
    .task-title-text {
      flex: 1;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-primary);
      transition: color 0.2s;
    }
    .task-item-card.completed .task-title-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .task-status-badge {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .task-status-badge.active {
      background: rgba(124,92,252,0.15);
      color: var(--accent-primary);
    }
    .task-status-badge.done {
      background: rgba(67,214,146,0.15);
      color: var(--success);
    }
    .delete-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      font-size: 1rem;
      transition: color 0.2s;
      opacity: 0;
    }
    .task-item-card:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { color: var(--danger); }
    /* EmptyStateWidget */
    .empty-state-widget {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state-widget .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state-widget p { font-size: 0.9rem; }
    /* AppFooter */
    .app-footer {
      margin-top: 40px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.75rem;
    }
    /* Animations */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

  // ============================================================
  // GENERATED CODE — Lovable Task Manager App
  // Prompt: "build me a task manager with a clean dashboard
  //          and dark mode, filter by status, add/complete tasks"
  // Generated in: ~11 minutes
  // Files: 1 (single-file HTML export from Lovable)
  // ============================================================

  // useTaskManagerReducer — state logic auto-generated
  const useTaskManagerReducer = (initialState) => {
    const [tasks, setTasks] = React.useState(initialState);
    const [inputValue, setInputValue] = React.useState('');
    const [activeFilter, setActiveFilter] = React.useState('all');

    const handleAddTask = React.useCallback(() => {
      const trimmedValue = inputValue.trim();
      if (!trimmedValue) return;
      const newTaskObject = {
        id: Date.now() + Math.random(),
        title: trimmedValue,
        completed: false,
        createdAt: new Date().toISOString(),
      };
      setTasks(prevTasks => [...prevTasks, newTaskObject]);
      setInputValue('');
    }, [inputValue]);

    const handleToggleTaskStatus = React.useCallback((taskId) => {
      setTasks(prevTasks =>
        prevTasks.map(task =>
          task.id === taskId ? { ...task, completed: !task.completed } : task
        )
      );
    }, []);

    const handleDeleteTask = React.useCallback((taskId) => {
      setTasks(prevTasks => prevTasks.filter(task => task.id !== taskId));
    }, []);

    const handleKeyPress = React.useCallback((e) => {
      if (e.key === 'Enter') handleAddTask();
    }, [handleAddTask]);

    const getFilteredTasksList = React.useCallback(() => {
      switch (activeFilter) {
        case 'active': return tasks.filter(t => !t.completed);
        case 'completed': return tasks.filter(t => t.completed);
        default: return tasks;
      }
    }, [tasks, activeFilter]);

    const computeTaskStats = React.useMemo(() => ({
      total: tasks.length,
      active: tasks.filter(t => !t.completed).length,
      completed: tasks.filter(t => t.completed).length,
    }), [tasks]);

    return {
      tasks, inputValue, activeFilter, setInputValue,
      setActiveFilter, handleAddTask, handleToggleTaskStatus,
      handleDeleteTask, handleKeyPress,
      filteredTasks: getFilteredTasksList(),
      taskStats: computeTaskStats,
    };
  };

  // AppHeader Component
  const AppHeaderComponent = () => (
    <div className="app-header">
      <div className="badge">✦ TaskFlow</div>
      <h1>Your Tasks,<br />Beautifully Managed</h1>
      <p>Stay on top of everything — built with Lovable</p>
    </div>
  );

  // StatsBar Component
  const StatsBarComponent = ({ stats }) => (
    <div className="stats-bar">
      {[
        { value: stats.total, label: 'Total Tasks' },
        { value: stats.active, label: 'Active' },
        { value: stats.completed, label: 'Completed' },
      ].map(({ value, label }) => (
        <div className="stat-card" key={label}>
          <div className="stat-value">{value}</div>
          <div className="stat-label">{label}</div>
        </div>
      ))}
    </div>
  );

  // InputPanel Component
  const InputPanelComponent = ({ inputValue, onChange, onAdd, onKeyPress }) => (
    <div className="input-panel">
      <div className="input-wrapper">
        <input
          className="task-input"
          type="text"
          placeholder="Add a new task..."
          value={inputValue}
          onChange={e => onChange(e.target.value)}
          onKeyDown={onKeyPress}
        />
        <button className="add-btn" onClick={onAdd}>+ Add Task</button>
      </div>
    </div>
  );

  // FilterTabBar Component
  const FilterTabBarComponent = ({ activeFilter, onFilterChange }) => (
    <div className="filter-tab-bar">
      {['all', 'active', 'completed'].map(filter => (
        <button
          key={filter}
          className={`filter-tab ${activeFilter === filter ? 'active' : ''}`}
          onClick={() => onFilterChange(filter)}
        >
          {filter.charAt(0).toUpperCase() + filter.slice(1)}
        </button>
      ))}
    </div>
  );

  // TaskItemCard Component
  const TaskItemCardComponent = ({ task, onToggle, onDelete }) => (
    <div
      className={`task-item-card ${task.completed ? 'completed' : ''}`}
      onClick={() => onToggle(task.id)}
    >
      <div className="checkbox-circle">
        {task.completed && <span className="checkbox-checkmark">✓</span>}
      </div>
      <span className="task-title-text">{task.title}</span>
      <span className={`task-status-badge ${task.completed ? 'done' : 'active'}`}>
        {task.completed ? 'Done' : 'Active'}
      </span>
      <button
        className="delete-btn"
        onClick={e => { e.stopPropagation(); onDelete(task.id); }}
        title="Delete"
      >✕</button>
    </div>
  );

  // EmptyStateWidget Component
  const EmptyStateWidgetComponent = ({ filter }) => (
    <div className="empty-state-widget">
      <div className="empty-icon">
        {filter === 'completed' ? '🎉' : filter === 'active' ? '✨' : '📝'}
      </div>
      <p>
        {filter === 'completed' ? 'No completed tasks yet' :
         filter === 'active' ? 'No active tasks' :
         'No tasks yet — add one above!'}
      </p>
    </div>
  );

  // TaskListContainer Component
  const TaskListContainerComponent = ({ tasks, filter, onToggle, onDelete }) => (
    <div className="task-list-container">
      {tasks.length === 0
        ? <EmptyStateWidgetComponent filter={filter} />
        : tasks.map(task => (
          <TaskItemCardComponent
            key={task.id}
            task={task}
            onToggle={onToggle}
            onDelete={onDelete}
          />
        ))
      }
    </div>
  );

  // Root App Component — AppShell
  const App = () => {
    const {
      inputValue, activeFilter, taskStats, filteredTasks,
      setInputValue, setActiveFilter,
      handleAddTask, handleToggleTaskStatus,
      handleDeleteTask, handleKeyPress,
    } = useTaskManagerReducer([
      { id: 1, title: 'Review pull requests', completed: false, createdAt: new Date().toISOString() },
      { id: 2, title: 'Update project README', completed: true, createdAt: new Date().toISOString() },
      { id: 3, title: 'Ship the feature branch', completed: false, createdAt: new Date().toISOString() },
    ]);

    return (
      <div className="app-shell">
        <AppHeaderComponent />
        <StatsBarComponent stats={taskStats} />
        <InputPanelComponent
          inputValue={inputValue}
          onChange={setInputValue}
          onAdd={handleAddTask}
          onKeyPress={handleKeyPress}
        />
        <FilterTabBarComponent
          activeFilter={activeFilter}
          onFilterChange={setActiveFilter}
        />
        <TaskListContainerComponent
          tasks={filteredTasks}
          filter={activeFilter}
          onToggle={handleToggleTaskStatus}
          onDelete={handleDeleteTask}
        />
        <div className="app-footer">
          <p>Built with Lovable · Vibe Version · {new Date().getFullYear()}</p>
        </div>
      </div>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
